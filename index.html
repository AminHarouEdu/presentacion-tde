<title>Las pantallas del centro</title>
<!--
  LAS PANTALLAS DEL CENTRO · SMART Board serie MX (V5) 75"
  Tutorial para el claustro · I.E.S. Duque de Rivas
  Amin Harou · coordinación TDE · curso 2026-27

  Un solo archivo. Las capturas van incrustadas como data URI: funciona sin conexión.
  Los vídeos son enlaces externos, no reproductores incrustados.

  Capturas oficiales: SMART Technologies (support.smarttech.com).
  Fotogramas de aula: canales TIC, TAC y más · Trilogic (YouTube), citados en cada pie.

  TECLAS: espacio/→ avanzar · ← atrás · N notas · G guion · R reiniciar · F pantalla completa
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF0F6; --stage:#FFFFFF; --panel:#F7F8FC;
  --ink:#131725; --ink-2:#4A5268; --ink-3:#79819A;
  --line:#D9DEEA; --line-2:#C2C9DA; --focus:#1E5BD6;
  --motion:#4C97FF; --looks:#9966FF; --operators:#59C059;
  --control:#FFAB19; --mb:#E8342A; --hielo:#4FC3F7;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Consolas",ui-monospace,monospace;
  --accent:#4C97FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080B14; --stage:#121828; --panel:#0E1422;
    --ink:#EDF0F8; --ink-2:#A8B1C7; --ink-3:#767F96;
    --line:#26304A; --line-2:#36415E; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#080B14; --stage:#121828; --panel:#0E1422;
  --ink:#EDF0F8; --ink-2:#A8B1C7; --ink-3:#767F96;
  --line:#26304A; --line-2:#36415E; --focus:#7FB0FF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- esqueleto ---------- */
.app{height:100vh;display:flex;flex-direction:column;padding:14px 20px 16px;gap:11px}
.bar{display:flex;align-items:center;gap:14px;flex:none}
.brand{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);flex:none}
.dots{display:flex;gap:4px;flex:none}
.dot{width:17px;height:5px;border-radius:3px;background:var(--line-2);transition:.2s;cursor:pointer;border:none;padding:0}
.dot:hover{background:var(--ink-3);transform:scaleY(1.8)}
.dot.on{background:var(--accent)}
.dot.done{background:var(--ink-3)}
.spacer{flex:1}
.keys{font:500 10.5px/1 var(--mono);color:var(--ink-3);letter-spacing:.04em;flex:none}
.clock{font:600 13px/1 var(--mono);color:var(--ink-2);letter-spacing:.04em;flex:none;
  padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--stage)}
.clock.over{color:var(--control);border-color:var(--control)}
.clock.way{color:var(--mb);border-color:var(--mb)}

.stage{flex:1;min-height:0;background:var(--stage);border:1px solid var(--line);
  border-radius:20px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.inner{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  padding:clamp(14px,2vh,24px) clamp(20px,2.8vw,42px)}
.howto{flex:none;border-top:1px solid var(--line);background:var(--panel);
  padding:9px clamp(20px,2.8vw,42px);display:flex;align-items:center;gap:10px;
  font:600 12.5px/1.35 var(--mono);color:var(--ink-2)}
.howto b{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  font-size:10px;flex:none}
kbd{font-family:var(--mono);font-weight:700;color:var(--ink);border:1px solid var(--line-2);
  border-radius:5px;padding:2px 6px;font-size:11px;background:var(--stage)}

/* ---------- tipografía ---------- */
.eyebrow{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px;flex:none}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:1.02;
  margin:0;font-size:clamp(27px,3.5vw,47px);text-wrap:balance}
h2{font-family:var(--display);font-weight:700;letter-spacing:-.022em;line-height:1.08;
  margin:0 0 7px;font-size:clamp(20px,2.35vw,31px);text-wrap:balance}
.lead{font-size:clamp(13.5px,1.25vw,17px);line-height:1.45;color:var(--ink-2);margin:8px 0 0;max-width:66ch}
.hint{font-size:12.2px;color:var(--ink-3);line-height:1.42}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hl{color:var(--accent);font-weight:600}

/* ---------- figura: capturas siempre sobre blanco, en los dos temas ---------- */
.fig{background:#FFFFFF;border:1px solid var(--line);border-radius:13px;padding:9px;
  box-shadow:0 12px 32px -18px rgba(10,16,40,.55);display:flex;flex-direction:column;min-height:0}
.fig img{width:100%;height:auto;max-height:56vh;object-fit:contain;display:block;border-radius:6px}
.figcap{font:500 10px/1.4 var(--mono);color:var(--ink-3);margin:7px 2px 0;letter-spacing:.01em}
.figcap a{font-size:10px}

/* ---------- dos columnas: figura + pasos ---------- */
.dos{display:flex;gap:clamp(16px,2.2vw,32px);flex:1;min-height:0;align-items:center}
.dosA{flex:1.25;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center}
.dos.estrecha .dosA{flex:.5}
.dosB{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px;overflow:auto}
.dos.ancha .dosA{flex:1.8}

/* ---------- lista de pasos numerados ---------- */
.ol{display:flex;flex-direction:column;gap:9px}
.li{display:flex;gap:11px;align-items:flex-start}
.li .n{flex:none;width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;
  font:700 11.5px/22px var(--mono);text-align:center;margin-top:1px}
.li .c>b{display:block;font-family:var(--display);font-weight:700;font-size:15px;
  letter-spacing:-.012em;line-height:1.2;margin-bottom:2px}
.li .c span{font-size:13px;line-height:1.44;color:var(--ink-2)}
.li .c code{font:600 12px/1 var(--mono);background:var(--panel);border:1px solid var(--line-2);
  border-radius:5px;padding:2px 6px;color:var(--ink)}

/* ---------- caso concreto ---------- */
.caso{border-left:4px solid var(--accent);padding:2px 0 2px 15px}
.caso b{display:block;font:700 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px}
.caso p{margin:0;font-size:13.4px;line-height:1.5;color:var(--ink-2)}
.caso p em{color:var(--ink);font-style:normal;font-weight:600}

/* ---------- tarjetas ---------- */
.tar{display:flex;gap:11px;flex-wrap:wrap}
.tar>div{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  background:var(--panel)}
.tar i{font:600 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-style:normal;display:block;margin-bottom:6px}
.tar>div>b{display:block;font-family:var(--display);font-size:16px;letter-spacing:-.012em;
  line-height:1.18;margin-bottom:4px}
.tar span{font-size:12.6px;line-height:1.44;color:var(--ink-2)}

/* ---------- tabla ---------- */
.tabla{width:100%;border-collapse:collapse}
.tabla th{font:600 9.5px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:0 12px 8px 0;vertical-align:bottom}
.tabla td{padding:9px 12px 9px 0;border-top:1px solid var(--line);font-size:13.4px;
  line-height:1.4;vertical-align:top}
.tabla td.d{color:var(--ink-2);font-size:12.6px}
.tabla tr.best td{background:color-mix(in srgb,var(--accent) 7%,transparent)}

/* ---------- sí / no ---------- */
.sn{display:flex;gap:14px;flex-wrap:wrap}
.sn>div{flex:1;min-width:250px;border-radius:14px;padding:15px 17px;border:1px solid var(--line)}
.sn .si{border-color:color-mix(in srgb,var(--operators) 55%,var(--line));
  background:color-mix(in srgb,var(--operators) 8%,var(--stage))}
.sn .no{border-color:color-mix(in srgb,var(--mb) 50%,var(--line));
  background:color-mix(in srgb,var(--mb) 7%,var(--stage))}
.sn h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 8px;letter-spacing:-.015em}
.sn .si h3{color:var(--operators)} .sn .no h3{color:var(--mb)}
.sn ul{margin:0;padding-left:18px}
.sn li{font-size:12.9px;line-height:1.5;color:var(--ink-2);margin-bottom:4px}
.sn li b{color:var(--ink);font-weight:600}

/* ---------- aviso ---------- */
.alarma{border:2.5px solid var(--mb);border-radius:16px;overflow:hidden;
  background:color-mix(in srgb,var(--mb) 7%,var(--stage))}
.alarma .cab{background:var(--mb);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px;
  font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.alarma .cue{padding:15px 18px 17px}
.fuga{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.fuga div{flex:1;min-width:145px;background:var(--stage);
  border:1px solid color-mix(in srgb,var(--mb) 30%,var(--line));border-radius:10px;padding:10px 12px}
.fuga b{display:block;font-family:var(--display);font-size:14.5px;letter-spacing:-.01em;margin-bottom:3px}
.fuga span{font-size:12px;line-height:1.4;color:var(--ink-2)}

/* ---------- enlaces ---------- */
.links{display:flex;flex-wrap:wrap;gap:10px}
.link{flex:1;min-width:245px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;
  background:var(--panel);text-decoration:none;color:inherit;display:block;transition:.14s;font-weight:400}
.link:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--stage));text-decoration:none}
.link i{font:600 9.5px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--accent);font-style:normal;display:block;margin-bottom:5px}
.link>b{display:block;font-size:14px;font-weight:600;line-height:1.3;margin-bottom:3px}
.link .u{font:500 11px/1.35 var(--mono);color:var(--ink-3);word-break:break-all;display:block}
.verv{font-size:12.5px}

/* ---------- notas, guion ---------- */
.notes{flex:none;border:1px dashed var(--line-2);border-radius:12px;padding:11px 15px;
  background:var(--panel);display:none}
.notes.on{display:block}
.notes h3{font:600 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--mb);margin:0 0 6px}
.notes p{margin:0;font-size:13.2px;line-height:1.5;color:var(--ink-2);max-width:112ch}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 93%,#000);
  z-index:50;padding:4vh 5vw 8vh;overflow:auto;display:none}
.scrim.on{display:block}
.guion{max-width:980px;margin:0 auto}
.gstep{display:flex;gap:18px;padding:12px 0;border-top:1px solid var(--line)}
.gstep .t{font:700 13px/1.5 var(--mono);color:var(--accent);flex:none;width:78px}
.gstep .c b{display:block;font-family:var(--display);font-size:17.5px;letter-spacing:-.012em;margin-bottom:4px}
.gstep .c p{margin:0;font-size:14.2px;line-height:1.5;color:var(--ink-2);max-width:82ch}
.gstep .c em{color:var(--ink);font-style:normal;font-weight:600}
.btn{border:1px solid var(--line-2);background:var(--stage);border-radius:10px;padding:11px 16px;
  font-weight:600;font-size:14.5px;cursor:pointer;transition:.14s}
.btn:hover{border-color:var(--ink-3)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn kbd{font:600 11px/1 var(--mono);opacity:.62;margin-left:8px;border:0;background:none;color:inherit}

/* ---------- móvil ---------- */
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh;padding:12px 14px 16px}
  .keys{display:none}
  .stage{min-height:70vh}
  .dos{flex-direction:column;gap:16px;align-items:stretch}
  .dosA,.dosB{flex:none;overflow:visible}
  .tar,.sn,.links,.fuga{flex-direction:column}
  .tabla td,.tabla th{font-size:12px}
}
</style>

<div class="app">
  <header class="bar">
    <span class="brand">Pantallas SMART &#183; TDE</span>
    <div class="dots" id="dots"></div>
    <span class="spacer"></span>
    <span class="keys">&#8592; &#8594; moverse &#183; N notas &#183; G guion &#183; F pantalla completa</span>
    <span class="clock" id="clock">0:00</span>
  </header>
  <main class="stage"><div class="inner" id="stage"></div>
    <div class="howto" id="howto"></div></main>
  <div class="notes" id="notes"><h3>Solo para ti &#183; pulsa N para ocultar</h3><p id="noteTxt"></p></div>
</div>
<div class="scrim" id="scrim"><div class="guion" id="guionBox"></div></div>

/* ==================== ACCIONES ==================== */
function next(){ if(S.i<STEPS.length-1){S.i++; render()} }
function prev(){ if(S.i>0){S.i--; render()} }
function act(a,el){
  if(a==='start'){ S.t0=Date.now(); next(); return }
  if(a==='goto'){S.i=Math.max(0,Math.min(STEPS.length-1,+el.getAttribute('data-i'))); render(); return}
  if(a==='reset'){reset(); render(); return}
}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-act="cerrar"]')){$('#scrim').className='scrim';return}
  if(e.target.closest('a')) return;
  var el=e.target.closest('[data-act]');
  if(el)act(el.getAttribute('data-act'),el);
});

/* ==================== GUION Y TECLADO ==================== */
function guionHTML(){
  return '<h2>Guion &#183; 35 minutos</h2><p class="lead" style="margin-bottom:16px">La banda del pie '+
  'indica en cada pantalla qu&#233; te toca hacer.</p>'+
  GUION.map(function(g){
    return '<div class="gstep"><div class="t">'+g[0]+'<br><span style="color:var(--ink-3);font-weight:500">'+
      g[1]+'</span></div><div class="c"><b>'+g[2]+'</b><p>'+g[3]+'</p></div></div>';
  }).join('')+
  '<div class="gstep"><div class="t">antes</div><div class="c"><b>Preparaci&#243;n</b>'+
  '<p>Un <em>pendrive con un PDF</em>, el <em>m&#243;vil en Andared</em> para la demostraci&#243;n de Mirror, y '+
  'haber comprobado esa misma ma&#241;ana que smartmirror.link responde desde el aula donde das la sesi&#243;n. '+
  'Los v&#237;deos son enlaces externos: necesitan conexi&#243;n, la presentaci&#243;n no.</p></div></div>'+
  '<div class="gstep"><div class="t">teclas</div><div class="c"><b>Manejo</b>'+
  '<p><em>espacio</em> o <em>&#8594;</em> avanzar &#183; <em>&#8592;</em> atr&#225;s &#183; '+
  '<em>clic en los puntitos</em> para saltar &#183; <em>N</em> notas &#183; <em>G</em> este guion &#183; '+
  '<em>R</em> reiniciar &#183; <em>F</em> pantalla completa.</p></div></div>'+
  '<div style="margin-top:20px"><button class="btn" data-act="cerrar">Cerrar<kbd>G</kbd></button></div>';
}
addEventListener('keydown',function(e){
  var k=e.key, st=cur(), scrim=$('#scrim');
  if(k==='g'||k==='G'){
    e.preventDefault();
    if(scrim.className.indexOf('on')<0){$('#guionBox').innerHTML=guionHTML();scrim.className='scrim on'}
    else scrim.className='scrim';
    return;
  }
  if(scrim.className.indexOf('on')>=0){ if(k==='Escape')scrim.className='scrim'; return }
  if(k==='n'||k==='N'){S.notes=!S.notes;render();return}
  if(k==='f'||k==='F'){e.preventDefault();
    if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
    else{document.exitFullscreen&&document.exitFullscreen()}
    return}
  if(k==='r'||k==='R'){e.preventDefault();reset();render();return}
  if(st.k==='portada'&&(k===' '||k==='Enter')){e.preventDefault();act('start');return}
  if(k===' '||k==='PageDown'||k==='ArrowRight'){e.preventDefault();next();return}
  if(k==='PageUp'||k==='ArrowLeft'){e.preventDefault();prev();return}
});

render();
})();
</script>
